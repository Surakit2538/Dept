<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Dept Money rich menu 2500x1686 (แบบ B 2x2)</title>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ขนาดจริงของ Rich menu แบบใหญ่ของ LINE: 2500 x 1686 พิกเซล เทมเพลต 4 ช่อง (2 x 2) ช่องละ 1250 x 843
     เส้นแบ่งช่องของ LINE อยู่ที่ x=1250 และ y=843 ช่องว่างระหว่างการ์ดจึงอยู่ตรงกลางเส้นนั้นพอดี
     สีจาก design/tokens.json เท่านั้น (โคบอลต์ + ทานตะวัน) */
  :root { --bg: #f3f6fd; --surface: #ffffff; --ink: #121a33; --mute: #5e6883; --chip: #ecf0fb; --soft: #dbe4fd;
          --accent: #2343c9; --accent2: #4466f2; --sun: #ffc23d; --sun-ink: #2e2100; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; background: var(--bg); font-family: "Anuphan", "Leelawadee UI", sans-serif; color: var(--ink); overflow: hidden; }
  .menu { width: 2500px; height: 1686px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 40px; padding: 40px; }
  .cell { position: relative; border-radius: 80px; background: var(--surface); padding: 100px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .ic { width: 300px; height: 300px; border-radius: 66px; display: grid; place-items: center; }
  .ic svg { width: 176px; height: 176px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h2 { font-size: 140px; font-weight: 700; line-height: 1.12; letter-spacing: -1px; }
  p { font-size: 70px; font-weight: 500; color: var(--mute); margin-top: 14px; }
  .blue { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #fff; }
  .blue p { color: var(--soft); }
  .sun { background: var(--sun); color: var(--sun-ink); }
  .sun p { color: var(--sun-ink); }
  .bars { position: absolute; right: 100px; top: 100px; display: flex; align-items: flex-end; gap: 26px; height: 250px; }
  .bars i { display: block; width: 62px; border-radius: 20px; background: rgba(255, 255, 255, .3); }
  .bars i.hi { background: var(--sun); }
  .brand { position: absolute; right: 100px; top: 112px; width: 150px; height: 150px; }
</style>
</head>
<body>
<div class="menu">
  <!-- A บนซ้าย: สรุปเดือนนี้ -->
  <div class="cell blue">
    <span class="ic" style="background: rgba(255,255,255,.18)"><svg viewBox="0 0 24 24" stroke="#ffffff"><path d="M5 19.5V11M10 19.5V5M15 19.5v-6M20 19.5V8.5"/></svg></span>
    <div class="bars"><i style="height:45%"></i><i style="height:80%"></i><i style="height:55%"></i><i class="hi" style="height:100%"></i></div>
    <div><h2>สรุปเดือนนี้</h2><p>เหลือเท่าไร ใครค้างคุณ</p></div>
  </div>
  <!-- B บนขวา: เพิ่มบิล -->
  <div class="cell sun">
    <span class="ic" style="background:#ffffff"><svg viewBox="0 0 24 24" stroke="#2e2100"><path d="M12 5v14M5 12h14"/></svg></span>
    <svg class="brand" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#2343c9"/><path d="M19 13h26v38l-4.3-3-4.4 3-4.3-3-4.3 3-4.4-3-4.3 3z" fill="#fff"/><path d="M32 16v31" stroke="#2343c9" stroke-width="2" stroke-dasharray="3 3"/><rect x="22.5" y="22" width="7" height="4" rx="2" fill="#ffc23d"/><rect x="34.5" y="22" width="7" height="4" rx="2" fill="#ffc23d"/></svg>
    <div><h2>เพิ่มบิล</h2><p>หารกับเพื่อน / ส่วนตัว</p></div>
  </div>
  <!-- C ล่างซ้าย: เคลียร์เงิน -->
  <div class="cell">
    <span class="ic" style="background:#2343c9"><svg viewBox="0 0 24 24" stroke="#ffffff"><path d="M5 8h13l-3.2-3.2M19 16H6l3.2 3.2"/></svg></span>
    <div><h2>เคลียร์เงิน</h2><p>QR โอน และส่งสลิป</p></div>
  </div>
  <!-- D ล่างขวา: เปิดเว็บ -->
  <div class="cell">
    <span class="ic" style="background:#ecf0fb"><svg viewBox="0 0 24 24" stroke="#2343c9"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg></span>
    <div><h2>เปิดเว็บ</h2><p>รายการ ปฏิทิน ตั้งค่า</p></div>
  </div>
</div>
</body>
</html>
