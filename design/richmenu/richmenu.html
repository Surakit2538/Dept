<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Dept Money rich menu 2500x1686</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ขนาดจริงของ Rich menu แบบใหญ่ของ LINE: 2500 x 1686 พิกเซล (บน 1 ช่อง + ล่าง 3 ช่อง) สีตามโทเคนโหมดมืดของแอป */
  :root { --bg: #0b1113; --surface: #141d20; --chip: #1c282c; --ink: #e8eeec; --mute: #93a3a0; --line: #25343a; --accent: #3cc4b4; --pay: #ff9a6b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; background: var(--bg); font-family: "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", sans-serif; color: var(--ink); overflow: hidden; }
  .menu { width: 2500px; height: 1686px; display: grid; grid-template-columns: 833px 834px 833px; grid-template-rows: 843px 843px; }
  .cell { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 36px; text-align: center; }
  .top { padding-top: 90px; grid-column: 1 / 4; background: linear-gradient(135deg, #0f2a29 0%, #123f3b 100%); flex-direction: row; gap: 120px; justify-content: center; }
  .bottom { background: var(--surface); }
  .bottom + .bottom { border-left: 4px solid var(--bg); }
  .top { border-bottom: 4px solid var(--bg); }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .badge { width: 330px; height: 330px; border-radius: 96px; display: grid; place-items: center; background: rgba(60, 196, 180, .16); color: var(--accent); }
  .badge .ic { width: 190px; height: 190px; }
  .small .badge { width: 250px; height: 250px; border-radius: 72px; background: var(--chip); }
  .small .badge .ic { width: 140px; height: 140px; }
  .top h1 { font-size: 190px; font-weight: 700; line-height: 1.1; letter-spacing: -2px; }
  .top p { font-size: 74px; color: #a9d8d2; margin-top: 26px; font-weight: 500; }
  .bottom h2 { font-size: 112px; font-weight: 700; line-height: 1.1; }
  .bottom p { font-size: 58px; color: var(--mute); font-weight: 500; margin-top: -14px; }
  .brand { position: absolute; left: 70px; top: 54px; display: flex; align-items: center; gap: 26px; font-size: 62px; font-weight: 600; color: #a9d8d2; }
  .brand svg { width: 84px; height: 84px; }
  .tag { position: absolute; right: 70px; top: 62px; font-size: 54px; color: #a9d8d2; font-weight: 500; }
  .bottom:nth-of-type(3) .badge { color: var(--pay); background: rgba(255, 154, 107, .14); }
</style>
</head>
<body>
<div class="menu">
  <div class="cell top">
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(-8 0)"><path d="M20 32 A28 28 0 0 1 20 88 Z" fill="#f3a10b"/><path d="M56 88 V46 A14 14 0 0 1 84 46 V88 M84 46 A14 14 0 0 1 112 46 V88" fill="none" stroke="#e8eeec" stroke-width="9"/></g></svg>
      Dept Money
    </div>
    <div class="tag">แตะเพื่อดูทันที</div>
    <div class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19.5V11M10 19.5V5M15 19.5v-6M20 19.5V8.5"/></svg></div>
    <div><h1>สรุปยอดเดือนนี้</h1><p>เหลือเท่าไร ใครค้างคุณ เตือนได้เลย</p></div>
  </div>
  <div class="cell bottom small">
    <div class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M12 8v6M9 11h6"/></svg></div>
    <div><h2>เพิ่มบิล</h2><p>จดรายจ่ายหารกับเพื่อน</p></div>
  </div>
  <div class="cell bottom small">
    <div class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M5 8h13l-3.2-3.2M19 16H6l3.2 3.2"/></svg></div>
    <div><h2>เคลียร์เงิน</h2><p>QR โอนและส่งสลิป</p></div>
  </div>
  <div class="cell bottom small">
    <div class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg></div>
    <div><h2>เปิดเว็บ</h2><p>บิล กระเป๋า ตั้งค่า</p></div>
  </div>
</div>
</body>
</html>
